name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"     # Monday morning: catch CVEs disclosed since the last push

# Cancel outdated pull request runs; on main, run per commit.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Jobs that need more ask for it explicitly.
permissions: read-all

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # gitleaks needs history to scan every commit in the PR
      - name: gitleaks (diff)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The action above only scans the commits in this push or PR. That misses a secret that
      # entered on an earlier commit and is still sitting in the tree -- exactly how a CLI
      # transcript quoting a PyPI token once survived in main. This second pass
      # scans the checked-out files themselves, so anything present in HEAD is caught no matter
      # which commit put it there.
      - name: gitleaks (working tree)
        run: |
          VER=8.30.1
          # Digest of gitleaks_${VER}_linux_x64.tar.gz from the v${VER} release,
          # cross-checked against gitleaks_${VER}_checksums.txt in the same release.
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  deps:
    name: dependency CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Extract audit dependency scopes
        run: |
          # Audit what the package DECLARES, not a local install. Installing torch from the
          # PyTorch CPU index yields a local version (2.14.0+cpu) that does not exist on PyPI,
          # so pip-audit cannot resolve it and --strict fails the job on that alone.
          #
          # The audit is split into two logical scopes:
          # 1. Core + [serve]: blocking audit because these form the shipped runtime package
          #    and published Docker image (`pip install ".[serve]"`). Vulnerabilities here fail CI.
          # 2. Other optional extras: non-blocking audit for optional integrations (e.g. langchain,
          #    llamaindex, crewai, onnx, mcp). Vulnerabilities are reported as warnings without failing CI,
          #    while execution/infrastructure failures still fail the job.
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]

          # Core + [serve] (blocking scope)
          core_specs = list(project.get("dependencies", []))
          serve_specs = list(project.get("optional-dependencies", {}).get("serve", []))
          core_seen = set()
          with open("requirements-audit-core.txt", "w") as fh:
              for spec in core_specs + serve_specs:
                  if spec not in core_seen:
                      core_seen.add(spec)
                      fh.write(f"{spec}\n")

          # Other optional extras (non-blocking scope)
          extras_specs = []
          for extra_name, extra_deps in project.get("optional-dependencies", {}).items():
              if extra_name != "serve":
                  extras_specs.extend(extra_deps)
          extras_seen = set()
          with open("requirements-audit-extras.txt", "w") as fh:
              for spec in extras_specs:
                  if spec not in extras_seen:
                      extras_seen.add(spec)
                      fh.write(f"{spec}\n")
          PY
          echo "core + [serve] declared names: $(wc -l < requirements-audit-core.txt)"
          cat requirements-audit-core.txt
          echo "other optional extras declared names: $(wc -l < requirements-audit-extras.txt)"
          cat requirements-audit-extras.txt

      - name: Audit core and serve dependencies (blocking)
        run: |
          # Core + [serve] vulnerabilities MUST block CI because these form the shipped runtime and Docker image.
          pip-audit --strict --desc -r requirements-audit-core.txt

      - name: Audit optional extra dependencies (non-blocking)
        run: |
          # Audit optional extras dynamically extracted from pyproject.toml.
          # Vulnerabilities found in optional extras are reported as non-blocking warnings so unrelated PRs
          # are not blocked, while genuine infrastructure/tool errors still fail the step.
          python - <<'PY'
          import os
          import subprocess
          import sys

          req_file = "requirements-audit-extras.txt"
          if not os.path.exists(req_file) or os.path.getsize(req_file) == 0:
              print("No optional extras declared to audit.")
              sys.exit(0)

          proc = subprocess.run(["pip-audit", "--desc", "-r", req_file], capture_output=True, text=True)

          if proc.stdout:
              print(proc.stdout)
          if proc.stderr:
              print(proc.stderr, file=sys.stderr)

          if proc.returncode == 0:
              print("No vulnerabilities found in optional extras.")
              sys.exit(0)

          stderr_upper = proc.stderr.upper()
          is_infra_error = (
              proc.returncode not in (0, 1) or
              "ERROR:PIP_AUDIT" in stderr_upper or
              "UNRECOGNIZED ARGUMENTS" in stderr_upper or
              not proc.stdout.strip()
          )

          if is_infra_error:
              print(f"::error::pip-audit execution or infrastructure failure (exit code {proc.returncode}).", file=sys.stderr)
              sys.exit(proc.returncode if proc.returncode != 0 else 1)
          else:
              print("::warning::Vulnerabilities found in optional extras (non-blocking). See audit output above.")
              sys.exit(0)
          PY

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  supply_chain:
    name: no unsafe deserialization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Weights must load through safetensors, never pickle
        run: |
          # torch.load / pickle execute arbitrary code during deserialization. Laya loads
          # checkpoints from the Hub, so a pickle path would be remote code execution on
          # `laya.load("someone/their-model")`.
          if grep -rnE --include='*.py' "\bpickle\b|torch\.load\(|joblib\.load\(|yaml\.load\(" laya/ laya-ts/scripts/; then
            echo "::error::unsafe deserialization in the shipped package - use safetensors"
            exit 1
          fi
          echo "OK: no unsafe deserialization in laya/ or laya-ts/scripts/"
      - name: No shell-out or dynamic exec in the shipped package
        run: |
          if grep -rnE "os\.system\(|subprocess\.|shell=True|\beval\(|\bexec\(" laya/ \
               | grep -v "\.eval()"; then
            echo "::error::shell-out or dynamic execution in the shipped package"
            exit 1
          fi
          echo "OK: no os.system/subprocess/eval/exec in laya/"
      - name: ONNX exporter requires safetensors weights
        run: python tests/test_export_onnx_safety.py
