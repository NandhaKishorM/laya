# Use with compose.yaml, and with compose.http.yaml when serving over HTTP. The
# `laya-serve` override repeats the CUDA build args and device reservation, because a
# Compose override replaces a service's `build` block whole rather than merging it, so
# adding this file without repeating them would silently serve on CPU.
services:
  laya:
    build:
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-cu128}"
    environment:
      LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]

  laya-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-cu128}"
    environment:
      LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
