name: Release

# Tag a commit v0.2.1 and push it; this builds, verifies the version matches the tag,
# publishes to PyPI and opens a GitHub Release.
#
# Set up once: PyPI -> Publishing -> add a Trusted Publisher for
#   owner NandhaKishorM, repo laya, workflow release.yml, environment pypi
# Then no API token ever lives in GitHub secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The two jobs that publish grant themselves more:
# pypi takes id-token: write, github_release takes contents: write.
permissions:
  contents: read

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # The same extras the CI `test` job installs, so the shared suite list below runs its
          # mcp/serve/langchain suites for real instead of letting them skip.
          pip install -e ".[mcp,serve,langchain]" httpx pytest

      # The canonical list CI runs (`scripts/test_suites.py`). This gate used to keep a hand-synced
      # copy that had drifted to 33 fewer suites than CI, so a regression in an omitted suite could
      # reach PyPI without any test failing.
      - name: Tests must pass before anything is published
        run: python scripts/test_suites.py

      - name: Build
        run: python -m build

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')   # workflow_dispatch has no tag to match
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Needs a Trusted Publisher on PyPI (Publishing -> add: owner NandhaKishorM,
      # repo laya, workflow release.yml, environment pypi). Until that exists the
      # exchange fails; skip-existing also makes a re-run safe after a manual upload.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          skip-existing: true

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading artifacts to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
