# Zensical (https://zensical.org) and Material for MkDocs can both build from this config.
# Preview locally:
#   pip install -r requirements-docs.txt && zensical serve
site_name: Laya
site_description: Multilingual, non-autoregressive System 1 decision engine
site_url: https://nandhakishorm.github.io/laya/
repo_url: https://github.com/NandhaKishorM/laya
repo_name: NandhaKishorM/laya
edit_uri: edit/main/docs/
copyright: Apache 2.0. Developed by Convai Innovations.

theme:
  name: material
  # Reuse the README logo to avoid maintaining a second copy.
  logo: https://raw.githubusercontent.com/NandhaKishorM/laya/main/assets/logo-mark.svg
  favicon: https://raw.githubusercontent.com/NandhaKishorM/laya/main/assets/logo-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

nav:
  - Home: index.md
  - Docker quickstart: docker.md
  - "LangChain & LangGraph": langchain.md
  - "Fine-tuning example: browser agent": finetune_browser_agent.md
