name: Rust

# Python is the product; Rust follows it. Report parity drift without blocking
# Python improvements. Always regenerate fixtures from this checkout, never cache
# goldens or quietly pass model-backed tests with missing artifacts.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"
  CARGO_BUILD_JOBS: "4"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  parity:
    name: build + Python parity (all checkpoints)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-rust/tools/requirements-regen.txt
      - name: Install regeneration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r laya-rust/tools/requirements-regen.txt
      - name: Test regeneration cache and skip guard
        run: python laya-rust/tools/test_ci_tools.py
      - name: Regenerate all goldens from Python at this commit
        run: python laya-rust/tools/regen_golden.py
      - name: Golden drift vs. committed (informational)
        run: |
          git --no-pager diff --stat -- laya-rust/tests/golden
          git status --short -- laya-rust/tests/golden
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Cache Cargo dependencies and build output (not goldens)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            laya-rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('laya-rust/Cargo.lock') }}
      - name: Cargo tests (serial model loads)
        working-directory: laya-rust
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --nocapture --test-threads=1 2>&1 | tee cargo-test.log
      - name: No test was skipped
        if: ${{ !cancelled() }}
        run: python laya-rust/tools/check_test_skips.py laya-rust/cargo-test.log --min-passed 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: rust-parity-diagnostics
          path: |
            laya-rust/cargo-test.log
            laya-rust/tests/golden
