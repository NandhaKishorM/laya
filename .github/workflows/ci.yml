name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel outdated pull request runs. On main, use a per-commit group so each push
  # gets its own run and started runs finish without cancelling or being cancelled by adjacent merges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # transformers probes for TensorFlow at import; when TF is present its abseil runtime can
  # deadlock model construction. Laya is torch-only.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  typescript:
    name: TypeScript (node${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: laya-ts
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: laya-ts/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Packed package end-to-end test
        run: npm run test:package

  feishu-benchmark:
    name: Chinese benchmark audit (no models or API)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python research/benchmarks/feishu_zh/audit.py
      - run: python -m unittest discover -s research/benchmarks/feishu_zh/tests -v
      # This job installs nothing, so running the audit here is what proves it needs
      # nothing but the standard library. Its test suite imports numpy and runs in `test`.
      - run: python research/benchmarks/zh_short_commands/audit.py
      # Standard library only, audit and tests alike, so both run here.
      - run: python research/benchmarks/es_phone_turns/audit.py
      - run: python -m unittest discover -s research/benchmarks/es_phone_turns/tests -v

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep this in lockstep with pyproject classifiers; packaging tests enforce that.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the job under a minute instead of pulling CUDA wheels
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # `mcp` so laya[mcp] resolution and the laya.mcp layer are both exercised, and
          # `serve` because laya.serve and examples/server.py both import fastapi -- without
          # it every test that touches them skips itself silently and passes.
          # `langchain` for the same reason: without langchain-core the runnables fall back
          # to their plain-object path, so tests/test_langchain.py never checks the real
          # Runnable behaviour (batch delegation, pydantic field validation) it is there for.
          pip install -e ".[mcp,serve,langchain]" httpx
          # The pytest-style suites need the runner; nothing else in this job uses it.
          pip install pytest

      - name: Import check
        run: python -c "import laya; print(laya.__version__); print(sorted(laya.__all__))"

      # The install above is what makes tests/test_langchain.py run on real Runnables, and
      # nothing proves it took: with langchain-core missing, the checks inside that file's
      # `if _RUNNABLE_AVAILABLE:` block vanish instead of failing and it still prints FAIL: 0.
      # Assert the install took before the shared list runs test_langchain_real_mode.py.
      - name: LangChain integration runs on the real base class
        run: |
          python -c "from laya.integrations.langchain import RunnableSerializable; \
            assert RunnableSerializable is not object, \
            'langchain-core is missing: laya.integrations.langchain fell back to a plain object, ' \
            'so the LangChain suites in this job test a shape no install produces'"

      # The canonical suite list lives in `scripts/test_suites.py`, which the release gate invokes
      # too. Naming the suites here and again in `release.yml` is how the publish gate came to run
      # 33 fewer than CI, so this step names one file and the script names them all (#374).
      - name: Test suites
        run: python scripts/test_suites.py

      - name: Chinese short-command benchmark tests
        run: python -m unittest discover -s research/benchmarks/zh_short_commands/tests -v

  # The `test` job above deliberately stays free of `onnx`: this is the lane that
  # installs it, so the exporter's quantization suite runs for real instead of
  # skip-guarding into a trivial pass. Weight-free -- it builds tiny synthetic
  # graphs, no checkpoint download.
  onnx-export:
    name: onnx export (quantization, weight-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install onnx onnxruntime

      - name: Quantized-export tests
        run: python tests/test_onnx_quantize.py

  # The eval harness needs numpy and laya only, so it stays a separate, weight-free job: metric
  # math, dataset parsing, the CLI and the API guard. The real-checkpoint gate is the scheduled
  # `evals` workflow, which needs weights and network.
  evals:
    name: evals (metric math, dataset, API guard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest

      - name: Eval harness tests
        run: python -m pytest tests/test_evals.py -q

      - name: Shortlist attribution tests
        run: python -m pytest tests/test_evals_shortlist.py -q

      - name: Eval API guard
        run: python tests/test_evals_api.py

      # The ONNX runner suite fakes the agent, so it stays weight-free and needs no
      # onnxruntime: the module only imports numpy, and ONNXAgent's constructor is
      # never called.
      - name: Eval ONNX runner tests
        run: python tests/test_evals_onnx.py

      # The offline research suites. Each claims a CI consumer and had none: `test_laya_eval.py`
      # says in its own docstring that it "runs in CI next to the other suites", while
      # `test_presentation_checks.py` and `test_act_head_eval.py` guard the eval harness's own
      # presentation and act-head math. They need only `laya` and numpy, so they belong here
      # rather than in the weekly weight lane. `test_metamorphic` is invoked as a module: run as a
      # script its `research` import fails (`No module named 'research'`).
      - name: Offline research eval suites
        run: |
          python research/eval/test_laya_eval.py
          python research/eval/test_presentation_checks.py
          python -m research.eval.test_metamorphic
          python research/evals/test_act_head_eval.py

      - name: Fixture dataset validates
        run: laya-evals validate research/evals/fixture.jsonl

  # Every workflow in this repo ran on ubuntu-latest only, so a test that fails off Linux was
  # invisible until a user hit it -- which is what happened to tests/test_download.py (#140).
  #
  # A separate job rather than an extra axis on `test`, deliberately: it leaves that job's name,
  # and therefore the `tests (pyX.Y)` required checks, exactly as they are. It runs one Python
  # because the variable that was untested is the OS, not the interpreter.
  test-windows:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # The +cpu index used on Linux is Linux/macOS only. On Windows the default PyPI wheel is
      # already CPU-only, so installing torch plainly is both correct and what a user gets.
      # The extras mirror the Linux install because the suite list below assumes them: without
      # `mcp`, tests/test_mcp.py prints SKIP and exits 0; without `langchain-core`,
      # tests/test_langchain.py runs against plain-object shims; and without `httpx` the
      # starlette TestClient that tests/test_serve.py imports raises at collection. Any of the
      # three leaves this lane green without testing the surface it names.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install -e ".[mcp,serve,langchain]" httpx
          pip install pytest
        shell: bash

      # bash on this runner so the quoting rules match the Linux job; the default shell on a
      # Windows runner is PowerShell, where `python -c "...; ..."` is not the same command.
      - name: Import check
        run: python -c "import laya; print(laya.__version__); print(sorted(laya.__all__))"
        shell: bash

      # Same suites as the Linux job. Guarded with -f so a suite added by another open branch
      # cannot make this job red on a tree that does not have it yet.
      - name: Routing and language-detection tests
        run: |
          for t in test_router test_criteria test_batch test_predict_long \
                   test_structured test_structured_api test_onnx_lang_parity \
                   test_download test_verify_checkpoints test_shortlist test_decision_model \
                   test_head_checkpointing test_packaging test_doc_tables \
                   test_tokenizer_cache test_tokenizer_concurrency test_lazy_import \
                   test_runtime_fixes test_lang_guess test_identifier_complexity \
                   test_lang_stats test_calibration_persistence test_calibrate test_context_manager \
                   test_criteria_normalization test_docker_entrypoint \
                   test_empty_questions test_router_memory test_shortlist_cosine \
                   test_temperature_loading test_confidence test_cli test_mcp \
                   test_mcp_device \
                   test_langchain test_portability test_training test_train \
                   test_example_server_limits test_blank_lang_routing \
                   test_export_onnx_safety test_load_errors test_revision_pinning; do
            if [ -f "tests/$t.py" ]; then python "tests/$t.py"; fi
          done
        shell: bash

      - name: Prediction hook tests
        run: |
          python tests/test_hooks.py
          python tests/test_hooks_api.py
        shell: bash

      - name: Question token reuse tests
        run: python tests/test_question_token_reuse.py
        shell: bash

      # Same pytest suites as the Linux job. They are named explicitly rather than added to
      # the loop above, because the loop runs each file as a script and that is exactly what does
      # not execute a pytest suite (#374).
      - name: Pytest suites (serve, batch, system-one, audit regressions, truncation, compile)
        run: |
          python -m pytest tests/test_serve.py \
                           tests/test_router_batch.py \
                           tests/test_predict_batch.py \
                           tests/test_system_one_lang.py \
                           tests/test_audit_regressions.py \
                           tests/test_truncation_direction.py \
                           tests/test_compile.py \
                           -q
        shell: bash

      # The Linux job's guard, repeated here: the install is what makes test_mcp.py and
      # test_langchain.py exercise their real base classes, and nothing else proves it took. mcp
      # and httpx are asserted the same way because their suites skip instead of failing.
      - name: Integrations run on their real base classes
        run: |
          python -c "import mcp, httpx, langchain_core"
          python -c "from laya.integrations.langchain import RunnableSerializable; \
            assert RunnableSerializable is not object, \
            'langchain-core is missing: laya.integrations.langchain fell back to a plain object'"
          python tests/test_langchain_real_mode.py
        shell: bash

      - name: Email cleaning tests
        run: python tests/test_email.py
        shell: bash

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check laya/ --select=E9,F63,F7,F82,F401,F811 --line-length=120
      - name: Byte-compile every module
        run: python -m compileall -q laya/ tests/

  typescript-sdk:
    name: TypeScript SDK (node${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install server and SDK
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[serve]' httpx pytest
          npm ci --prefix sdk/typescript
      - name: Server contract and generated presets
        run: |
          python -m pytest tests/test_serve.py
          python sdk/typescript/scripts/sync_presets.py --check
      - name: SDK types, transport, packaging and live inference
        working-directory: sdk/typescript
        run: |
          npm test
          npm run test:integration
          npm pack --dry-run

  build:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Version must match the tag on a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "pyproject $pkg != tag $tag"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
