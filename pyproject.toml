[build-system]
# >=77 for SPDX `license` expressions (PEP 639); the previous TOML license table is deprecated.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laya"
dynamic = ["version"]
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools.dynamic]
# Single source of truth for the version; release/CI compare the git tag against it.
version = { attr = "laya.__version__" }

[tool.setuptools.packages.find]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery would bail out.
include = ["laya*"]

[project.urls]
Homepage = "https://huggingface.co/convaiinnovations/laya"
Demo = "https://huggingface.co/spaces/convaiinnovations/laya-demo"
