name: Docs

# Builds the documentation site from docs/ and publishes it to GitHub Pages.
# Enable Pages before deploying: Settings -> Pages -> Source: GitHub Actions.

on:
  pull_request:
    paths: [docs/**, laya/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, laya/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated pull request builds; let an active deploy on main finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt

      # --strict fails on every warning, including links the site cannot resolve.
      # Use absolute GitHub URLs for files outside docs/ so links work when pages in docs/
      # are read on GitHub or on the site.
      # Griffe's docstring warnings (a parameter the signature does not have, a missing type)
      # are printed but pass --strict, and the API reference is built from those docstrings.
      # --clean because a cached build skips unchanged modules and prints no warnings for them.
      - run: |
          set -o pipefail
          zensical build --strict --clean 2>&1 | tee "$RUNNER_TEMP/docs-build.log"
          if grep '^griffe:' "$RUNNER_TEMP/docs-build.log"; then
            echo "::error::Fix the docstring warnings above; the API reference is built from them."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: docs (deploy)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
