name: Release

# Tag a commit v0.2.1 and push it; this builds, verifies the version matches the tag,
# publishes to PyPI and opens a GitHub Release.
#
# Set up once: PyPI -> Publishing -> add a Trusted Publisher for
#   owner NandhaKishorM, repo laya, workflow release.yml, environment pypi
# Then no API token ever lives in GitHub secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The two jobs that publish grant themselves more:
# pypi takes id-token: write, github_release takes contents: write.
permissions:
  contents: read

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest

      - name: Tests must pass before anything is published
        run: |
          python tests/test_router.py
          python tests/test_criteria.py
          python tests/test_batch.py
          python tests/test_predict_long.py
          python tests/test_state_budget.py
          python tests/test_hooks.py
          python tests/test_hooks_api.py
          python tests/test_onnx_lang_parity.py
          python tests/test_onnx_truncation_parity.py
          python tests/test_onnx_batch.py
          python tests/test_onnx_long.py
          python tests/test_onnx_sort.py
          python tests/test_email.py
          python tests/test_download.py
          python tests/test_shortlist.py
          python tests/test_decision_model.py
          python tests/test_head_checkpointing.py
          python tests/test_truncation.py
          python -m pytest tests/test_truncation_direction.py -q
          python tests/test_packaging.py
          python tests/test_compose_env.py
          python tests/test_doc_tables.py
          python tests/test_env_docs.py
          python tests/test_tokenizer_cache.py
          python tests/test_tokenizer_concurrency.py
          python tests/test_lazy_import.py
          python tests/test_runtime_fixes.py
          python tests/test_agent_gate.py
          python tests/test_lang_guess.py
          python tests/test_option_collapse.py
          python tests/test_identifier_complexity.py
          python tests/test_lang_stats.py
          python tests/test_calibration_persistence.py
          python tests/test_context_manager.py
          python tests/test_criteria_normalization.py
          python tests/test_docker_entrypoint.py
          python tests/test_empty_questions.py
          python tests/test_router_memory.py
          python tests/test_shortlist_cosine.py
          python tests/test_temperature_loading.py
          python tests/test_confidence.py
          python tests/test_cli.py
          python tests/test_training.py
          python tests/test_portability.py
          python tests/test_blank_lang_routing.py
          python tests/test_load_errors.py
          python tests/test_revision_pinning.py

      - name: Build
        run: python -m build

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')   # workflow_dispatch has no tag to match
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Needs a Trusted Publisher on PyPI (Publishing -> add: owner NandhaKishorM,
      # repo laya, workflow release.yml, environment pypi). Until that exists the
      # exchange fails; skip-existing also makes a re-run safe after a manual upload.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          skip-existing: true

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading artifacts to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
